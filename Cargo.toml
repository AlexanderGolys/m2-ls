[package]
name = "m2-ls"
version = "1.1.1"
authors = ["Alexander Golys <alexandergolys@gmail.com>"]
description = "Language server for Macaulay2"
edition = "2021"
rust-version = "1.88"
license = "GPL-3.0-only"
repository = "https://github.com/AlexanderGolys/m2-ls"
readme = "README.md"
keywords = ["macaulay2", "lsp", "language-server", "tree-sitter"]
categories = ["development-tools"]

[dependencies]
tower-lsp = "0.20"
tower = { version = "0.4", default-features = false }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
m2-syn = "0.6.0"
tree-sitter = "0.26.9"
tree-sitter-macaulay2 = "=6.2.0"
tree-sitter-md = { version = "0.5.3", features = ["parser"] }
ropey = "1.6.1"
