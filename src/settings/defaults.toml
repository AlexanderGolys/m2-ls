[catalog]
enabled = true
version = "0.1.*"

[logging]
level = "info"

# Opening a document indexes this many .m2 files of its workspace folder,
# nearest first; files it loads are always indexed. A walk also stops after
# visiting scanEntryLimit directory entries, however few sources it found.
[workspace]
indexFileLimit = 500
scanEntryLimit = 100000

[diagnostics]
enabled = true
disabled = []
warningsAsHint = []
warningsAsInfo = []
# Also suggest rewrites that turn an error into a fallback value: `h.k ?? v`
# for `if h.k =!= null then h.k else v`, yielding `v` where `h` lacks `k`.
errorCatchingRewrites = false

[diagnostics.emitAs]
error = []
warning = []
info = []
hint = []
fixActionOnly = []


[formatting]
# The preset under every key below: "core" reproduces the Macaulay2 Core
# library, "modern" its newer 4-column files and Emacs M2-mode. Keys set
# explicitly override the preset.
profile = "core"
# Parentheses the syntax does not need, as in `(a*b) + c`: "off", "action"
# (the "Remove redundant parentheses in file" source action), or "format" (also
# removed whenever the document is formatted).
redundantParentheses = "action"
# "keep" spares call arguments: `f(x)` stays instead of becoming `f x`.
callParentheses = "remove"

# How much a document must show before a "detect" rule follows it.
[formatting.detect]
minSamples = 3      # fewer occurrences: the rule's fallback
threshold = 0.6     # the share the document's majority must reach

[formatting.indent]
width = "detect"            # columns per open bracket, or "detect": 2, 4 or 5
fallbackWidth = 5           # what "detect" uses without a majority
whitespace = "emacsTabs"    # "emacsTabs": a tab per tabWidth columns, then spaces
                            # "spaces", or "tabs": one tab per indent level
tabWidth = 8                # columns per tab, also for measuring line widths
closers = "body"            # "body": a line starting with ) } ] keeps the body's indent
                            # "opener": dedented to the opener line's indent

[formatting.lines]
breaks = "keep"     # "keep": only indentation and spacing change
                    # "wrap": also break lines longer than softWidth
                    # "normalize": also apply every layout rule below
softWidth = 100     # 0 or null: none
hardWidth = 0       # never wrapped past; 0 or null: none
maxBlankLines = 1
trimBlankLinesInBrackets = true   # after a line-ending ( {, before a line-starting ) }
finalNewline = true
trimTrailingWhitespace = true

# Read only when lines.breaks is not "keep".
[formatting.layout]
closeParen = "hug"                          # "hug": last); "ownLine"
closeBrace = "ownLine"                      # "ownLine": } alone, at the body's indent; "hug"
functionBody = "breakWhenMultiStatement"    # "always", "breakWhenMultiStatement", "keep"
statements = "onePerLine"                   # "onePerLine": a line ends at each ;  "keep"
singleLineIf = "whenFits"                   # "whenFits", "never", "keep"
elsePlacement = "ownLine"                   # "ownLine": at the if line's indent; "afterClose": ) else (
thenPlacement = "withCondition"             # "withCondition", or "ownLine" when the condition spans lines
conditionBreaks = "beforeOperator"          # "beforeOperator": or/and start the lines; "afterOperator"

[formatting.spacing]
comma = "detect"            # "space", "tight", or "detect" (fallback "space")
lambdaParamComma = "detect" # "space", "tight", "sameAsComma", or "detect" (fallback "tight")
semicolon = "space"         # before more code on the same line: "space" or "tight"
# (x) or ( x ), per pair: "tight", "space", "keep"; or one of these for all
bracketsInside = { "()" = "tight", "{}" = "tight", "[]" = "tight", "<||>" = "tight" }
callParen = "tight"         # f(x) or f (x): "tight", "space", "keep"
keywordParen = "space"      # then ( / do ( / if (: "space", "tight", "keep"
indexContextTight = true    # + - * / tight inside a bracket right after _ # ^ . : x#(i+1)
trailingComment = "oneSpace"    # the gap before a trailing --: "oneSpace" or "keep"
preserveAlignment = true    # keep padding lining a token up with the neighbouring line

# Binary operators written `a + b`, `a^b`, or as the document mostly writes
# them (spaced when it says too little). Listing an operator in one list
# removes it from the others' defaults; operators in none keep their spacing.
# Word operators (`or`, `and`, `xor`, `not`) are always spaced; prefix
# operators are tight to their operand unless `spaced` lists them (`<< x`).
[formatting.spacing.operators]
spaced = [
    ":=", "=", "->", "=>", "<-", "==", "===", "=!=", "!=", "<", ">", "<=", ">=",
    "<<", ">>", "@@", "\\", "++", "?", "**", "||", "%", "|", "..<", "&",
]
tight = ["#", ".", ".?", "#?", "_", "^", ":"]
detect = ["+", "-", "*", "/", "//", ".."]

[formatting.comments]
bannerWidth = 77    # rule-only comment lines of 60 to 90 dashes; 0 or null: left

# What `profile` sets beneath the explicit keys. "core" is the table above.
[formatting.profiles.core]

[formatting.profiles.modern.indent]
width = 4
fallbackWidth = 4
whitespace = "spaces"

[formatting.profiles.modern.lines]
breaks = "wrap"

[formatting.profiles.modern.spacing]
comma = "space"
lambdaParamComma = "sameAsComma"

[formatting.profiles.modern.spacing.operators]
spaced = [
    ":=", "=", "->", "=>", "<-", "==", "===", "=!=", "!=", "<", ">", "<=", ">=",
    "<<", ">>", "@@", "\\", "++", "?", "**", "||", "%", "|", "..<", "&",
    "+", "-", "*", "/", "//", "..",
]
detect = []


[inlayHints]
argTypes = false
everywhere = false

[inlayHints.argNames]
enabled = true
requireBracket = true
ignoreVariadic = true
maxLength = 15

[inlayHints.types]
enabled = true
after = {
    call = true,
    endOfLine = true,
    endOfCell = true,
    assignment = true,
    brackets = ["parentheses"], # "array" | "list" | "angle bar" | "holder"
    return = false
}

[inlayHints.hide]
types = ["Thing", "Nothing"]
calls = ["toString", "net", "toList"]
nonExactMark = false
literal = true
trivial = true
sequential = true
beforeSemicolon = false
operatorCalls = true

[semanticTokens]
standardOnly = false
defaultLibrary = ["CompiledFunction"]


# These paths are discovered automatically. Uncomment an override only when
# discovery misses an installation or a source checkout.
[macaulay2]
runtimeDiscovery = true
 # executable = "/path/to/M2"
# prefix = "/path/to/installation"
# applicationDirectory = "~/.Macaulay2"

# Discovery may query M2; the server also works without a usable executable.

[sources]
enabled = true

# Additional package directories, in search order. These can be used without M2.
packagePaths = []

# Core sources are discovered automatically and have special analysis rules.
corePath = "auto"
primaryCodePaths = []

[initialization]
files = ["${applicationDirectory}/init.m2"]
